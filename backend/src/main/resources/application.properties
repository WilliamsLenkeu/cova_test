spring.application.name=taskmanager

spring.datasource.url=jdbc:mysql://localhost:3306/taskmanager?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=taskuser
# spring.datasource.password=taskpass
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ponytail: secret en clair OK pour le test local ; en prod → env var / secret manager
app.jwt.secret=cova-taskmanager-dev-secret-change-me-32chars-min
app.jwt.expiration-ms=86400000

server.port=8080
